<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="轻记 · 一个简单的体重变化记录与可视化小站。">
<meta name="theme-color" content="#f4f2eb">
<title>轻记 · 减重记录</title>
<style>
:root{--bg:#f4f2eb;--ink:#252820;--mut:#7b8270;--line:#dcded1;--card:#fffef9;--green:#667b35;--green-d:#4a5c2a;--lime:#d9ed9e;--red:#b4554c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}input{font:inherit}a{color:inherit;text-decoration:none}::selection{background:var(--lime)}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#2c3325;color:var(--lime);font-size:17px;font-weight:700}
.bname{font-size:15px;font-weight:700}.bname b{display:block;font-weight:400;color:var(--mut);font-size:10px;letter-spacing:3px;margin-top:2px}
.today{font-size:12px;color:var(--mut)}
.hero{padding:52px 0 30px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:3px;color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #e7eadb}
.hero h1{font-size:clamp(34px,4.6vw,56px);line-height:1.2;font-weight:600;letter-spacing:-1px;margin:18px 0 12px}
.hero h1 span{color:var(--green)}
.intro{font-size:14px;line-height:1.9;color:var(--mut);margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px}
.stat small{font-size:10px;letter-spacing:2px;color:var(--mut)}
.stat .big{font-size:26px;font-weight:700;margin:7px 0 3px;font-variant-numeric:tabular-nums}
.stat p{margin:0;font-size:11px;color:var(--mut);line-height:1.7}
.good{color:#4c7a3d}.bad{color:var(--red)}
.goal-ctl{margin-top:4px}
.gform{display:flex;gap:6px;align-items:center;margin-top:4px}
.gform input{width:84px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#faf9f3;font-size:13px}
.mini{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.mini-b{border:1px solid var(--line);background:#faf9f3;color:var(--mut);border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer}
.mini-b:hover{color:var(--ink);border-color:#9aa583}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.add{margin-bottom:18px}
.add-form{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.add-form label{display:flex;flex-direction:column;gap:6px;font-size:10px;letter-spacing:1px;color:var(--mut)}
.add-form input{border:1px solid var(--line);background:#faf9f3;border-radius:10px;padding:11px 13px;font-size:14px;color:var(--ink);outline:none;min-width:0;width:100%}
.add-form input:focus{border-color:#8f9e6a;box-shadow:0 0 0 3px rgba(143,158,106,.18)}
.add-form input[type=number]::-webkit-inner-spin-button,.add-form input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.add-form input[type=number]{-moz-appearance:textfield;appearance:textfield}
.wdate{width:190px}.wwei{width:160px}.wnote{flex:1;min-width:190px}
.add-form .wwei input{padding-right:36px}
.inwrap{position:relative;display:block}
.inwrap i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--mut);font-size:12px;pointer-events:none}
.btn{border:0;background:#2c3325;color:#f2f4e7;border-radius:10px;padding:13px 20px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--green-d)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start;padding-bottom:60px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.ph h2{font-size:18px;font-weight:700;margin:0}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:20px;height:0;vertical-align:middle;margin-right:6px}
.lg-act{border-top:3px solid var(--green)}
.lg-goal{border-top:2px dashed #c07a63}
.chart-box{position:relative;height:340px}
.chart-box canvas{display:block;width:100%;height:100%;cursor:crosshair}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px;pointer-events:none}.empty[hidden]{display:none}.tip[hidden]{display:none}
.hint{margin:12px 0 0;font-size:11px;color:var(--mut);text-align:center}
.tip{position:absolute;pointer-events:none;background:#2c3325;color:#f2f4e7;border-radius:10px;padding:8px 12px;font-size:12px;z-index:5;box-shadow:0 6px 18px rgba(40,46,28,.18);line-height:1.6}
.tt-d{font-size:10px;color:#b8c2a4;letter-spacing:1px}
.tt-w{font-weight:700;font-size:14px}
.tt-w .chip{margin-left:6px;font-size:10px}
.tt-s{font-size:11px;color:#b8c2a4}
.ops{display:flex;gap:8px}
.ghost{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:9px;padding:7px 12px;font-size:11px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:#9aa583}
.ghost.danger:hover{color:var(--red);border-color:#dfb8ad;background:#fdf3f0}
#list{max-height:520px;overflow:auto;scrollbar-width:thin;scrollbar-color:#cdd2bf transparent}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.rd{min-width:96px}
.rd b{display:block;font-size:14px;font-weight:700}
.rd span{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.note{flex:1;min-width:0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:10px;padding:3px 9px;border-radius:99px;background:#eef1e2;color:var(--green-d);white-space:nowrap}
.chip.bad{background:#f6e6e0;color:var(--red)}
.chip.flat{background:#efefe9;color:var(--mut)}
.rw{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px;min-width:56px;text-align:right}
.acts{display:flex;gap:6px}
.ib{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font-size:13px;line-height:1}
.ib:hover{color:var(--ink);border-color:#9aa583}
.ib.del:hover{color:var(--red);border-color:#dfb8ad;background:#fdf3f0}
.empty-state{padding:42px 10px;text-align:center;color:var(--mut);font-size:13px;line-height:2}
footer{border-top:1px solid var(--line);padding:22px 0 30px;font-size:10px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2c3325;color:#f2f4e7;padding:11px 20px;border-radius:99px;font-size:13px;z-index:50;box-shadow:0 8px 22px rgba(40,46,28,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #92ac56;outline-offset:2px}
@media(max-width:1020px){.grid{grid-template-columns:1fr}#list{max-height:none}}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.hero{padding-top:38px}}
@media(max-width:640px){.wrap{padding:0 16px}.stats{gap:10px}.stat{padding:14px}.stat .big{font-size:22px}.add-form label{width:100%}.wdate,.wwei,.wnote{width:100%!important}.btn{width:100%}.chart-box{height:300px}.row{flex-wrap:wrap}.note{flex-basis:100%;order:5}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="brand" href="#" aria-label="轻记首页"><span class="mark">轻</span><span class="bname">轻记<b>WEIGHT JOURNAL · 减重记录</b></span></a>
  <div class="today" id="today"></div>
</header>
<main>
<section class="hero">
  <p class="eyebrow"><span class="dot"></span> LIGHT LOG · EVERY GRAM COUNTS</p>
  <h1>每一次站上秤，<span>都算数。</span></h1>
  <p class="intro">把每天的体重记下来，慢慢就能看见趋势。<br>别太苛刻，短期的波动也是旅程的一部分。</p>
</section>

<section class="stats" aria-label="数据概览">
  <article class="stat"><small>当前体重</small><div class="big" id="stCur">—</div><p id="stCurAt">暂无记录</p></article>
  <article class="stat"><small>累计变化</small><div class="big" id="stDiff">—</div><p id="stDiffAt">较首次记录</p></article>
  <article class="stat"><small>记录数</small><div class="big" id="stCount">0</div><p id="stSpan">等待第一条记录</p></article>
  <article class="stat"><small>目标体重</small><div class="big" id="goalVal">—</div><div class="goal-ctl" id="goalCtl"></div></article>
</section>

<section class="panel add" aria-label="添加记录">
  <form id="addForm" class="add-form" autocomplete="off">
    <label class="wdate">日期<input type="date" id="inDate" required></label>
    <label class="wwei">体重（kg）<span class="inwrap"><input type="number" id="inWeight" placeholder="如 72.5" min="20" max="400" step="0.1" required><i>kg</i></span></label>
    <label class="wnote">备注（可选）<input type="text" id="inNote" placeholder="晨起空腹 / 晚餐后…" maxlength="30"></label>
    <button class="btn" type="submit">记一笔 ↳</button>
  </form>
</section>

<section class="grid">
  <div class="panel">
    <div class="ph"><h2>体重趋势</h2><div class="legend"><span><i class="lg-act"></i>实际</span><span><i class="lg-goal"></i>目标</span></div></div>
    <div class="chart-box" id="chartBox">
      <canvas id="chart" aria-label="体重变化折线图"></canvas>
      <div class="empty" id="chartEmpty">还没有数据，先在「记一笔」里写下今天吧 ✍</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <p class="hint">把鼠标移到曲线上，可查看每次记录的详情</p>
  </div>

  <div class="panel">
    <div class="ph"><h2>历史记录</h2>
      <div class="ops"><button class="ghost" id="btnExport" type="button" title="导出为 JSON 文件">导出</button><button class="ghost danger" id="btnClear" type="button">清空</button></div>
    </div>
    <div id="list"></div>
  </div>
</section>
</main>
<footer><span>轻记 · 数据只保存在你自己的浏览器里，导出可备份</span><span>© <span id="year"></span></span></footer>
</div>
<div id="toast" class="toast" hidden></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY='wt_records_v1',GOAL_KEY='wt_goal_v1';
var records=[];try{records=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){records=[]}
var goal=parseFloat(localStorage.getItem(GOAL_KEY));if(!(goal>0))goal=null;
var lastPts=[],lastHi=-1;
var GL={l:46,r:16,t:14,b:30};

function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){toast('保存失败：浏览器存储不可用')}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toDate(s){return new Date(s+'T00:00:00')}
var WD=['日','一','二','三','四','五','六'];
function md(s){return parseInt(s.slice(5,7),10)+'月'+parseInt(s.slice(8,10),10)+'日'}
function wd(s){return '周'+WD[toDate(s).getDay()]}
function rel(s){var d=Math.round((toDate(iso(new Date()))-toDate(s))/864e5);if(d===0)return '今天';if(d===1)return '昨天';if(d>1&&d<30)return d+'天前';return ''}
function f1(v){return (Math.round(v*10)/10).toFixed(1)}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(t._tm);t._tm=setTimeout(function(){t.hidden=true},2400)}

/* ---------- 统计卡片 ---------- */
function renderStats(){
  var sorted=[].concat(records).sort(function(a,b){return a.d<b.d?-1:1});
  var cur=sorted[sorted.length-1];
  var $c=$('stCur'),$cd=$('stDiff'),$ct=$('stCount'),$ca=$('stCurAt'),$cdA=$('stDiffAt'),$cs=$('stSpan');
  if(!cur){$c.textContent='—';$cd.textContent='—';$cd.className='big';$ct.textContent='0';$ca.textContent='暂无记录';$cdA.textContent='较首次记录';$cs.textContent='等待第一条记录';return}
  $c.textContent=f1(cur.w)+' kg';
  $ca.textContent='记录于 '+md(cur.d)+' '+wd(cur.d);
  $ct.textContent=records.length+' 次';
  var days=Math.max(1,Math.round((toDate(cur.d)-toDate(sorted[0].d))/864e5)+1);
  $cs.textContent=records.length>1?('时间跨度 '+days+' 天'):'开始记录第一天';
  if(records.length>1){
    var d=cur.w-sorted[0].w;
    if(d===0){$cd.textContent='— 持平';$cd.className='big';}
    else{$cd.textContent=(d>0?'↑ +':'↓ ')+f1(Math.abs(d))+' kg';$cd.className='big '+(d>0?'bad':'good');}
    $cdA.textContent='较首次记录（'+md(sorted[0].d)+'）';
  }else{$cd.textContent='—';$cd.className='big';$cdA.textContent='再记一次就能看变化'}
}

/* ---------- 目标体重 ---------- */
function renderGoal(){
  var ctl=$('goalCtl'),val=$('goalVal');
  if(goal){val.textContent=f1(goal)+' kg';val.className='big';
    var cur=records.length?[].concat(records).sort(function(a,b){return a.d<b.d?-1:1}).pop().w:null;
    var html='';
    if(cur==null)html+='<p style="font-size:11px;color:var(--mut);margin:0 0 4px">记下第一条后可见差距</p>';
    else{var d=cur-goal;html+='<p style="font-size:11px;margin:0 0 4px">'+(d<=0?'<span class="good">已达成目标 ✓</span>':'还差 <b>'+f1(d)+' kg</b>')+'</p>'}
    html+='<div class="mini"><button class="mini-b" id="gEdit" type="button">修改</button><button class="mini-b" id="gClr" type="button">清除</button></div>';
    ctl.innerHTML=html;
    $('gEdit').onclick=function(){var v=prompt('设置目标体重（kg）',goal);setGoal(v)};
    $('gClr').onclick=function(){goal=null;localStorage.removeItem(GOAL_KEY);renderAll();toast('已清除目标')};
  }else{val.textContent='—';val.className='big';
    ctl.innerHTML='<form class="gform" id="gForm"><input type="number" id="gIn" placeholder="如 60" min="20" max="400" step="0.1"><button class="mini-b" type="submit">设定</button></form>';
    $('gForm').onsubmit=function(e){e.preventDefault();setGoal($('gIn').value)};
  }
}
function setGoal(v){
  var n=parseFloat(v);
  if(isNaN(n)||n<20||n>400){toast('请输入有效的目标体重');return}
  goal=Math.round(n*10)/10;localStorage.setItem(GOAL_KEY,String(goal));
  renderAll();toast('目标已设为 '+f1(goal)+' kg，慢慢来');
}

/* ---------- 添加记录 ---------- */
$('addForm').addEventListener('submit',function(e){
  e.preventDefault();
  var d=$('inDate').value,w=parseFloat($('inWeight').value),n=$('inNote').value.trim();
  if(!d){toast('请选择日期');return}
  if(isNaN(w)||w<20||w>400){toast('请输入有效的体重（20–400 kg）');return}
  var exist=false;
  records=records.filter(function(r){if(r.d===d){exist=true;return false}return true});
  records.push({d:d,w:Math.round(w*10)/10,n:n});
  save();$('inWeight').value='';$('inNote').value='';
  renderAll();
  toast(exist?('已更新 '+md(d)+' 的记录为 '+f1(w)+' kg'):'已记录 '+md(d)+' · '+f1(w)+' kg');
});

/* ---------- 历史记录列表 ---------- */
function renderList(){
  var box=$('list');
  if(!records.length){box.innerHTML='<div class="empty-state">还没有记录～<br>从「记一笔」开始，写下今天的数据吧</div>';return}
  var sorted=[].concat(records).sort(function(a,b){return a.d<b.d?-1:1});
  var items=[];
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    var d=i>0?r.w-sorted[i-1].w:0;
    var chip='';
    if(i>0){if(d<0)chip='<span class="chip good">↓ '+f1(Math.abs(d))+'</span>';else if(d>0)chip='<span class="chip bad">↑ '+f1(d)+'</span>';else chip='<span class="chip flat">持平</span>'}
    var relT=rel(r.d);
    items.push('<div class="row">'+
      '<div class="rd"><b>'+md(r.d)+'</b><span>'+wd(r.d)+(relT?' · '+relT:'')+'</span></div>'+
      '<span class="note">'+(r.n?esc(r.n):'')+'</span>'+
      chip+
      '<span class="rw">'+f1(r.w)+' kg</span>'+
      '<span class="acts"><button class="ib" data-edit="'+r.d+'" type="button" title="修改">✎</button><button class="ib del" data-del="'+r.d+'" type="button" title="删除">✕</button></span>'+
      '</div>');
  }
  box.innerHTML=items.reverse().join('');
}
$('list').addEventListener('click',function(e){
  var del=e.target.closest('[data-del]');
  if(del){var d=del.getAttribute('data-del');var r=records.find(function(x){return x.d===d});if(!r)return;
    if(!confirm('删除 '+md(d)+'（'+f1(r.w)+' kg）这条记录？'))return;
    records=records.filter(function(x){return x.d!==d});save();renderAll();toast('已删除 '+md(d)+' 的记录');return}
  var ed=e.target.closest('[data-edit]');
  if(ed){var dd=ed.getAttribute('data-edit');var rr=records.find(function(x){return x.d===dd});if(!rr)return;
    var v=prompt('修改 '+md(dd)+' 的体重（kg）：',rr.w);
    if(v==null)return;var n=parseFloat(v);
    if(isNaN(n)||n<20||n>400){toast('请输入有效的体重');return}
    rr.w=Math.round(n*10)/10;save();renderAll();toast('已更新为 '+f1(n)+' kg')}
});
$('btnExport').onclick=function(){
  if(!records.length){toast('还没有数据可导出');return}
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));
  a.download='weight-records-'+iso(new Date())+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},500);
};
$('btnClear').onclick=function(){
  if(!records.length){toast('还没有数据');return}
  if(!confirm('确定清空全部 '+records.length+' 条记录？此操作不可恢复'))return;
  if(!confirm('再确认一次：真的要全部删除吗？'))return;
  records=[];save();renderAll();toast('已清空全部记录');
};

/* ---------- 图表 ---------- */
function niceStep(range,count){
  var raw=range/count||0.1,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),norm=raw/mag,s;
  if(norm<=1)s=1;else if(norm<=2)s=2;else if(norm<=5)s=5;else s=10;
  return s*mag;
}
function drawChart(hi){
  hi=hi===undefined?-1:hi;
  var cv=$('chart'),box=$('chartBox'),emp=$('chartEmpty'),tip=$('tip');
  var w=box.clientWidth,h=box.clientHeight;
  if(!records.length){emp.hidden=false;cv.style.display='none';tip.hidden=true;lastPts=[];lastHi=-1;return}
  emp.hidden=true;cv.style.display='block';
  var dpr=window.devicePixelRatio||1;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  var arr=[].concat(records).sort(function(a,b){return a.d<b.d?-1:1});
  var t0=+toDate(arr[0].d),t1=+toDate(arr[arr.length-1].d),ts=(t1-t0)||1;
  var lo=arr[0].w,hiW=arr[0].w;
  arr.forEach(function(r){lo=Math.min(lo,r.w);hiW=Math.max(hiW,r.w)});
  if(goal){lo=Math.min(lo,goal);hiW=Math.max(hiW,goal)}
  var pad=Math.max(0.6,(hiW-lo)*0.22),yMin=lo-pad,yMax=hiW+pad;
  var iw=w-GL.l-GL.r,ih=h-GL.t-GL.b;
  function X(t){return arr.length===1?GL.l+iw/2:GL.l+(t-t0)/ts*iw}
  function Y(v){return GL.t+(yMax-v)/(yMax-yMin)*ih}
  ctx.font='11px Arial';ctx.textBaseline='middle';

  /* 水平网格与 Y 轴刻度 */
  var step=niceStep(yMax-yMin,4),v=Math.ceil(yMin/step)*step;
  ctx.textAlign='right';
  while(v<=yMax+step/1000){
    var yy=Math.round(Y(v));
    ctx.strokeStyle='#e7e9dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(GL.l,yy);ctx.lineTo(w-GL.r,yy);ctx.stroke();
    ctx.fillStyle='#8a8f80';
    ctx.fillText(String(Math.round(v*10)/10),GL.l-9,yy);
    v+=step;
  }
  /* X 轴刻度（至多 6 个） */
  var n=Math.min(6,arr.length),ids=[];
  for(var j=0;j<n;j++){var k=Math.round((arr.length-1)*j/(n-1));if(ids.indexOf(k)<0)ids.push(k)}
  ctx.textAlign='center';ctx.textBaseline='top';
  ids.forEach(function(i){
    var x=Math.round(X(+toDate(arr[i].d)));
    ctx.strokeStyle='#eef0e4';ctx.beginPath();ctx.moveTo(x,GL.t);ctx.lineTo(x,h-GL.b);ctx.stroke();
    ctx.fillStyle='#8a8f80';
    var s=arr[i].d.slice(2,4)===(new Date().getFullYear()%100)||i>0?arr[i].d.slice(5,7)+'/'+arr[i].d.slice(8,10):arr[i].d.slice(2);
    ctx.fillText(s,x,h-GL.b+7);
  });
  /* 折线数据点坐标 */
  var pts=arr.map(function(r){return{d:r.d,w:r.w,x:X(+toDate(r.d)),y:Y(r.w)}});
  lastPts=pts;
  /* 面积渐变 */
  var grad=ctx.createLinearGradient(0,GL.t,0,h-GL.b);
  grad.addColorStop(0,'rgba(102,123,53,.22)');grad.addColorStop(1,'rgba(102,123,53,0)');
  ctx.beginPath();ctx.moveTo(pts[0].x,h-GL.b);
  pts.forEach(function(p){ctx.lineTo(p.x,p.y)});
  ctx.lineTo(pts[pts.length-1].x,h-GL.b);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  /* 目标线（虚线） */
  if(goal){var gy=Y(goal);
    if(gy>GL.t&&gy<h-GL.b){
      ctx.strokeStyle='#c07a63';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(GL.l,gy);ctx.lineTo(w-GL.r,gy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.textAlign='right';ctx.textBaseline='bottom';
      ctx.fillStyle='#c07a63';ctx.font='11px Arial';
      ctx.fillText('目标 '+f1(goal)+' kg',w-GL.r,gy-4);
    }}
  /* 折线 */
  ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});
  ctx.strokeStyle='#5c7040';ctx.lineWidth=2.6;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
  /* 数据点 */
  pts.forEach(function(p,i){
    ctx.beginPath();ctx.arc(p.x,p.y,4.2,0,Math.PI*2);
    ctx.fillStyle='#2c3325';ctx.fill();
    ctx.strokeStyle='#fffef9';ctx.lineWidth=2;ctx.stroke();
    if(i===0||i===pts.length-1){
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);
      ctx.strokeStyle=i===pts.length-1?'rgba(92,112,64,.45)':'rgba(138,143,128,.45)';
      ctx.lineWidth=1.5;ctx.stroke();
    }
  });
  /* 悬停高亮 */
  if(hi>=0&&hi<pts.length){
    var p=pts[hi];
    ctx.strokeStyle='rgba(44,51,37,.18)';ctx.lineWidth=1;
    ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(p.x,GL.t);ctx.lineTo(p.x,h-GL.b);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.strokeStyle='rgba(92,112,64,.5)';ctx.lineWidth=5;ctx.stroke();
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle='#2c3325';ctx.fill();
  }
}
function hideTip(){$('tip').hidden=true}
function showTip(idx,mx,my){
  var p=lastPts[idx],box=$('chartBox'),tip=$('tip');
  if(!p)return;
  var diff=p.w-(idx>0?lastPts[idx-1].w:null);
  var line='';
  if(idx>0){if(diff<0)line='<span class="good">↓ '+f1(Math.abs(diff))+'</span>';else if(diff>0)line='<span class="bad">↑ '+f1(diff)+'</span>';else line='<span style="color:#b8c2a4">持平</span>'}
  tip.innerHTML='<div class="tt-d">'+md(p.d)+' · '+wd(p.d)+'</div><div class="tt-w">'+f1(p.w)+' kg <span class="chip">'+(idx>0?line:'首次记录')+'</span></div><div class="tt-s">较上一条：'+(idx>0?(diff<0?('↓ '+f1(Math.abs(diff))):diff>0?('↑ '+f1(diff)):'—')+' kg':'—')+'</div>';
  tip.hidden=false;
  var tw=tip.offsetWidth,th=tip.offsetHeight;
  var left=Math.min(Math.max(6,p.x-tw/2),box.clientWidth-tw-6);
  tip.style.left=left+'px';
  var top=(my-th-16>6)?my-th-16:my+14;
  tip.style.top=top+'px';
}
(function(){
  var cv=$('chart'),box=$('chartBox');
  cv.addEventListener('mousemove',function(e){
    if(!lastPts.length)return;
    var rect=box.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;
    var best=-1,bd=1e9;
    lastPts.forEach(function(p,i){var dd=Math.abs(p.x-mx);if(dd<bd){bd=dd;best=i}});
    if(bd>30){hideTip();if(lastHi!==-1){lastHi=-1;drawChart(-1)}return}
    if(lastHi!==best){lastHi=best;drawChart(best)}
    showTip(best,mx,my);
  });
  cv.addEventListener('mouseleave',function(){hideTip();if(lastHi!==-1){lastHi=-1;drawChart(-1)}});
})();
var rzTm;
window.addEventListener('resize',function(){clearTimeout(rzTm);rzTm=setTimeout(function(){hideTip();drawChart(-1)},160)});

/* ---------- 渲染 ---------- */
function renderAll(){renderStats();renderGoal();drawChart(-1);renderList()}
$('inDate').value=iso(new Date());
$('today').textContent='今天 · '+md(iso(new Date()))+' '+wd(iso(new Date()));
$('year').textContent=new Date().getFullYear();
renderAll();
})();
</script>
